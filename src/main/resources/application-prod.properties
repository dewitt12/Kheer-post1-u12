spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
spring.datasource.username=${DATASOURCE_USER:appuser}
spring.datasource.password=${DATASOURCE_PASSWORD:}
# update crea las tablas la primera vez en una BD vacia (Railway/Render).
# Se puede endurecer a "validate" si se usa Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.com.ejemplo=INFO

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
